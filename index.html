<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pipu & Kate - AI Companion</title>
  <style>
    :root {
      --primary: #00d8e6;
      --glow: rgba(0, 216, 230, 0.45);
      --glow-deep: rgba(0, 140, 160, 0.25);
      --bg-top: #070913;
      --bg-bottom: #0d1224;
      --shell-bg: linear-gradient(145deg, #161822, #090a0f);
    }

    body.theme-kate {
      --primary: #ff4da6;
      --glow: rgba(255, 77, 166, 0.45);
      --glow-deep: rgba(180, 20, 100, 0.28);
      --bg-top: #120710;
      --bg-bottom: #1e0b1a;
      --shell-bg: linear-gradient(145deg, #22131d, #0d060b);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 35%, var(--bg-bottom), var(--bg-top));
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      transition: background 0.6s ease;
      position: relative;
    }

    /* خلفية النجوم الخفيفة */
    .stars {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,0.3), transparent),
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.35), transparent),
        radial-gradient(1.5px 1.5px at 85% 65%, rgba(255,255,255,0.25), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* الشريط العلوي */
    .top-bar {
      width: 100%;
      max-width: 480px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .persona-switcher {
      display: flex;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 30px;
      padding: 4px;
      gap: 4px;
    }

    .persona-btn {
      border: none;
      background: transparent;
      color: #aaa;
      padding: 6px 16px;
      border-radius: 24px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .persona-btn.active {
      background: var(--primary);
      color: #050508;
      box-shadow: 0 0 14px var(--glow);
    }

    .icon-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .icon-btn:active { transform: scale(0.92); }

    /* مسرح الوجه */
    .stage-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
      margin: auto 0;
    }

    .stage {
      position: relative;
      width: 300px;
      height: 300px;
    }

    .head {
      position: absolute;
      inset: 0;
      border-radius: 36%;
      background: var(--shell-bg);
      box-shadow:
        0 25px 60px rgba(0,0,0,0.85),
        0 0 35px var(--glow-deep),
        inset 0 -8px 25px rgba(0,0,0,0.7),
        inset 0 4px 15px rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.5s, box-shadow 0.5s;
    }

    .screen {
      width: 78%;
      height: 66%;
      background: #030306;
      border-radius: 26%;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 25px #000, 0 0 2px rgba(255,255,255,0.08);
    }

    .screen-shine {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 32%;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
      border-radius: 26% 26% 50% 50%;
      pointer-events: none;
    }

    /* العيون المستطيلة بتوهج داكن */
    .eyes-container {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      width: 78%;
      height: 34%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .eye-unit {
      position: relative;
      width: 41%;
      height: 100%;
    }

    .eyebrow {
      position: absolute;
      top: -14px;
      left: 10%;
      width: 80%;
      height: 5px;
      background: var(--primary);
      border-radius: 6px;
      box-shadow: 0 0 10px var(--glow);
      transition: all 0.3s ease;
    }

    /* ميل الحواجب حسب الشخصية */
    body:not(.theme-kate) .eye-unit.left .eyebrow { transform: rotate(6deg); }
    body:not(.theme-kate) .eye-unit.right .eyebrow { transform: rotate(-6deg); }
    body.theme-kate .eye-unit.left .eyebrow { transform: rotate(-8deg) translateY(-2px); border-radius: 50% 50% 0 0; }
    body.theme-kate .eye-unit.right .eyebrow { transform: rotate(8deg) translateY(-2px); border-radius: 50% 50% 0 0; }

    .eye {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 40% 35%, var(--primary), #08121e 135%);
      border-radius: 14px; /* مستطيلة بحواف ناعمة */
      box-shadow:
        0 0 16px var(--glow),
        inset 0 0 12px rgba(0, 0, 0, 0.75);
      position: relative;
      animation: blink 4.5s infinite ease-in-out;
      transition: all 0.3s ease;
    }

    body.theme-kate .eye {
      background: radial-gradient(circle at 40% 35%, var(--primary), #1f0614 135%);
      border-radius: 16px;
    }

    /* رموش لطيفة لشخصية Kate */
    .lash {
      display: none;
      position: absolute;
      top: 12%;
      width: 10px;
      height: 4px;
      background: var(--primary);
      border-radius: 4px;
      box-shadow: 0 0 8px var(--glow);
    }
    body.theme-kate .lash { display: block; }
    .eye-unit.left .lash { left: -7px; transform: rotate(25deg); }
    .eye-unit.right .lash { right: -7px; transform: rotate(-25deg); }

    /* لمعة العين */
    .eye::after {
      content: "";
      position: absolute;
      top: 16%;
      right: 18%;
      width: 22%;
      height: 20%;
      background: rgba(255,255,255,0.7);
      border-radius: 4px;
    }

    /* حالات العيون */
    .state-listening .eye {
      transform: scale(1.08);
      box-shadow: 0 0 26px var(--glow), inset 0 0 8px rgba(0,0,0,0.5);
    }
    .state-thinking .eyes-container {
      animation: lookAround 1.4s infinite ease-in-out;
    }
    .state-happy .eye {
      border-radius: 22px 22px 8px 8px;
      height: 75%;
      margin-top: 12%;
    }

    /* الفم والموجة الصوتية */
    .mouth-area {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 44%;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mouth-idle {
      width: 26px;
      height: 5px;
      background: var(--primary);
      border-radius: 6px;
      box-shadow: 0 0 10px var(--glow);
      transition: all 0.3s ease;
    }

    body.theme-kate .mouth-idle {
      width: 24px;
      height: 10px;
      background: transparent;
      border-bottom: 3.5px solid var(--primary);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 4px 10px var(--glow);
    }

    /* موجة الصوت عند التحدث */
    .wave-bars {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 22px;
    }
    .state-speaking .mouth-idle { display: none; }
    .state-speaking .wave-bars { display: flex; }

    .wave-bars span {
      width: 4px;
      height: 6px;
      background: var(--primary);
      border-radius: 4px;
      box-shadow: 0 0 8px var(--glow);
      animation: wave 0.5s infinite ease-in-out;
    }
    .wave-bars span:nth-child(2) { animation-delay: 0.1s; }
    .wave-bars span:nth-child(3) { animation-delay: 0.2s; }
    .wave-bars span:nth-child(4) { animation-delay: 0.3s; }
    .wave-bars span:nth-child(5) { animation-delay: 0.15s; }

    @keyframes wave {
      0%, 100% { height: 5px; }
      50% { height: 20px; }
    }
    @keyframes blink {
      0%, 46%, 52%, 100% { transform: scaleY(1); }
      49% { transform: scaleY(0.08); }
    }
    @keyframes lookAround {
      0%, 100% { transform: translateX(-50%); }
      30% { transform: translateX(-58%) translateY(-4px); }
      70% { transform: translateX(-42%) translateY(-4px); }
    }

    /* نص الحالة والرد */
    .status-badge {
      margin-top: 16px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: var(--primary);
      text-transform: uppercase;
      opacity: 0.85;
    }

    .caption-box {
      margin-top: 10px;
      max-width: 88vw;
      min-height: 44px;
      text-align: center;
      font-size: 0.95rem;
      color: #d8dce8;
      line-height: 1.5;
      padding: 0 12px;
    }

    /* شريط التحكم السفلي */
    .bottom-dock {
      width: 100%;
      max-width: 440px;
      padding: 18px 24px 28px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    .dock-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .dock-btn.mic-main {
      width: 68px;
      height: 68px;
      font-size: 1.6rem;
      background: rgba(255,255,255,0.08);
      border: 2px solid var(--primary);
      box-shadow: 0 0 20px var(--glow-deep);
    }

    .dock-btn.mic-main.recording {
      background: var(--primary);
      color: #050508;
      box-shadow: 0 0 30px var(--glow);
      transform: scale(1.08);
    }

    /* النوافذ المنبثقة (الإعدادات / المهام / الكتابة) */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      backdrop-filter: blur(8px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.open { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 400px;
      background: #121521;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-header h3 { font-size: 1.05rem; color: var(--primary); }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
    .field input, .field textarea {
      width: 100%;
      background: #090b12;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .field input:focus { border-color: var(--primary); }

    .save-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #050508;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 6px;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.05);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <!-- الشريط العلوي -->
  <div class="top-bar">
    <button class="icon-btn" onclick="openModal('tasksModal')" title="المهام">📋</button>

    <div class="persona-switcher">
      <button class="persona-btn active" id="btn-pipu" onclick="setPersona('pipu')">Pipu</button>
      <button class="persona-btn" id="btn-kate" onclick="setPersona('kate')">Kate</button>
    </div>

    <button class="icon-btn" onclick="openModal('settingsModal')" title="إعدادات API">⚙️</button>
  </div>

  <!-- مسرح الوجه -->
  <div class="stage-wrapper">
    <div class="stage" id="faceStage">
      <div class="head">
        <div class="screen">
          <div class="screen-shine"></div>
          <div class="eyes-container">
            <div class="eye-unit left">
              <div class="eyebrow"></div>
              <div class="lash"></div>
              <div class="eye"></div>
            </div>
            <div class="eye-unit right">
              <div class="eyebrow"></div>
              <div class="lash"></div>
              <div class="eye"></div>
            </div>
          </div>
          <div class="mouth-area">
            <div class="mouth-idle"></div>
            <div class="wave-bars">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="status-badge" id="statusText">PIPU READY</div>
    <div class="caption-box" id="captionBox">اضغط على الميكروفون للتحدث معي...</div>
  </div>

  <!-- شريط التحكم السفلي -->
  <div class="bottom-dock">
    <button class="dock-btn" onclick="openModal('chatModal')" title="محادثة نصية">💬</button>
    <button class="dock-btn mic-main" id="micBtn" onclick="toggleVoice()" title="تحدث">🎙️</button>
    <button class="dock-btn" onclick="stopSpeaking()" title="إيقاف الصوت">⏹️</button>
  </div>

  <!-- نافذة إعدادات Custom API -->
  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>⚙️ إعدادات Custom API</h3>
        <button class="icon-btn" onclick="closeModal('settingsModal')">✕</button>
      </div>
      <div class="field">
        <label>رابط المزود (API Endpoint URL)</label>
        <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions" />
      </div>
      <div class="field">
        <label>مفتاح الوصول (API Key)</label>
        <input type="password" id="apiKey" placeholder="sk-..." />
      </div>
      <div class="field">
        <label>اسم النموذج (Model Name)</label>
        <input type="text" id="apiModel" placeholder="gpt-4o-mini / claude-3-5-sonnet" />
      </div>
      <button class="save-btn" onclick="saveSettings()">حفظ الإعدادات محلياً</button>
    </div>
  </div>

  <!-- نافذة المهام -->
  <div class="modal" id="tasksModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>📋 قائمة مهامي</h3>
        <button class="icon-btn" onclick="closeModal('tasksModal')">✕</button>
      </div>
      <div class="field" style="display:flex; gap:8px;">
        <input type="text" id="newTaskInput" placeholder="أضف مهمة جديدة..." />
        <button class="icon-btn" style="border-radius:10px; background:var(--primary); color:#000;" onclick="addTask()">+</button>
      </div>
      <div id="tasksList" style="max-height:220px; overflow-y:auto;"></div>
    </div>
  </div>

  <!-- نافذة الكتابة السريعة -->
  <div class="modal" id="chatModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>💬 رسالة سريعة</h3>
        <button class="icon-btn" onclick="closeModal('chatModal')">✕</button>
      </div>
      <div class="field">
        <textarea id="textInput" rows="3" placeholder="اكتب رسالتك هنا..."></textarea>
      </div>
      <button class="save-btn" onclick="sendTextMessage()">إرسال</button>
    </div>
  </div>

  <script>
    let currentPersona = localStorage.getItem('marik_persona') || 'pipu';
    let isListening = false;
    let recognition = null;
    let chatHistory = [];

    const personas = {
      pipu: {
        name: 'PIPU',
        pitch: 0.95,
        rate: 1.05,
        greeting: 'أهلاً سيمو! أنا Pipu، جاهز للبرمجة والأتمتة. بماذا نبدأ؟',
        systemPrompt: 'أنت Pipu، مساعد ذكي ظريف، سريع البديهة، وخبير تقني تتحدث باللهجة العربية الودودة والمختصرة. ردودك قصيرة ومباشرة لتناسب النطق الصوتي.'
      },
      kate: {
        name: 'KATE',
        pitch: 1.25,
        rate: 1.02,
        greeting: 'مرحباً سيمو! أنا Kate، سعيدة جداً برؤيتك اليوم. كيف أقدر أساعدك؟',
        systemPrompt: 'أنتِ Kate، مساعدة ذكية لطيفة، ظريفة، ومشجعة تتحدثين بالعربية بأسلوب دافئ ومرح. اجعلي ردودكِ قصيرة وواضحة لتناسب المحادثة الصوتية.'
      }
    };

    // تهيئة الشخصية
    function setPersona(p) {
      currentPersona = p;
      localStorage.setItem('marik_persona', p);
      document.body.classList.toggle('theme-kate', p === 'kate');
      document.getElementById('btn-pipu').classList.toggle('active', p === 'pipu');
      document.getElementById('btn-kate').classList.toggle('active', p === 'kate');
      setFaceState('happy', `${personas[p].name} READY`);
      document.getElementById('captionBox').innerText = personas[p].greeting;
      chatHistory = [];
    }

    function setFaceState(state, label) {
      const stage = document.getElementById('faceStage');
      stage.className = 'stage' + (state ? ` state-${state}` : '');
      if (label) document.getElementById('statusText').innerText = label;
    }

    // النوافذ
    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    // حفظ إعدادات API
    function saveSettings() {
      localStorage.setItem('custom_api_url', document.getElementById('apiUrl').value.trim());
      localStorage.setItem('custom_api_key', document.getElementById('apiKey').value.trim());
      localStorage.setItem('custom_api_model', document.getElementById('apiModel').value.trim());
      closeModal('settingsModal');
      speakText('تم حفظ إعدادات المزود بنجاح!');
    }

    function loadSettings() {
      document.getElementById('apiUrl').value = localStorage.getItem('custom_api_url') || '';
      document.getElementById('apiKey').value = localStorage.getItem('custom_api_key') || '';
      document.getElementById('apiModel').value = localStorage.getItem('custom_api_model') || '';
    }

    // إعداد الميكروفون (Web Speech API)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      recognition.interimResults = false;
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('recording');
        setFaceState('listening', 'LISTENING...');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('captionBox').innerText = `أنت: "${transcript}"`;
        processUserInput(transcript);
      };

      recognition.onerror = (e) => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('recording');
        setFaceState('', `${personas[currentPersona].name} READY`);
        if (e.error === 'not-allowed') {
          document.getElementById('captionBox').innerText = 'يرجى السماح بصلاحية الميكروفون في المتصفح (HTTPS أو localhost).';
        }
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('recording');
      };
    }

    function toggleVoice() {
      if (!recognition) {
        alert('متصفحك لا يدعم التعرف الصوتي المباشر، جرب Chrome.');
        return;
      }
      window.speechSynthesis.cancel();
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function sendTextMessage() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      closeModal('chatModal');
      document.getElementById('captionBox').innerText = `أنت: "${text}"`;
      processUserInput(text);
    }

    // الاتصال بـ Custom API
    async function processUserInput(userText) {
      const apiUrl = localStorage.getItem('custom_api_url');
      const apiKey = localStorage.getItem('custom_api_key');
      const apiModel = localStorage.getItem('custom_api_model') || 'gpt-4o-mini';

      if (!apiUrl || !apiKey) {
        const msg = 'يرجى إدخال رابط ومفتاح Custom API من أيقونة الإعدادات في الأعلى أولاً.';
        document.getElementById('captionBox').innerText = msg;
        speakText(msg);
        openModal('settingsModal');
        return;
      }

      setFaceState('thinking', 'THINKING...');

      chatHistory.push({ role: 'user', content: userText });
      if (chatHistory.length > 8) chatHistory = chatHistory.slice(-8);

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: apiModel,
            messages: [
              { role: 'system', content: personas[currentPersona].systemPrompt },
              ...chatHistory
            ]
          })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || 'لم أستلم رداً واضحاً من المزود.';
        chatHistory.push({ role: 'assistant', content: reply });

        document.getElementById('captionBox').innerText = reply;
        speakText(reply);
      } catch (err) {
        setFaceState('', 'ERROR');
        document.getElementById('captionBox').innerText = 'تعذر الاتصال بالمزود: تأكد من الرابط أو إعدادات CORS.';
      }
    }

    // النطق الصوتي وتحريك الموجة
    function speakText(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ar-SA';
      utterance.pitch = personas[currentPersona].pitch;
      utterance.rate = personas[currentPersona].rate;

      utterance.onstart = () => setFaceState('speaking', 'SPEAKING...');
      utterance.onend = () => setFaceState('', `${personas[currentPersona].name} READY`);
      utterance.onerror = () => setFaceState('', `${personas[currentPersona].name} READY`);

      window.speechSynthesis.speak(utterance);
    }

    function stopSpeaking() {
      window.speechSynthesis.cancel();
      setFaceState('', `${personas[currentPersona].name} READY`);
    }

    // إدارة المهام
    function renderTasks() {
      const tasks = JSON.parse(localStorage.getItem('marik_tasks') || '[]');
      const list = document.getElementById('tasksList');
      list.innerHTML = tasks.map((t, i) => `
        <div class="task-item">
          <span>${t}</span>
          <button style="background:none;border:none;color:#ff5555;cursor:pointer;" onclick="deleteTask(${i})">✕</button>
        </div>
      `).join('');
    }

    function addTask() {
      const inp = document.getElementById('newTaskInput');
      if (!inp.value.trim()) return;
      const tasks = JSON.parse(localStorage.getItem('marik_tasks') || '[]');
      tasks.push(inp.value.trim());
      localStorage.setItem('marik_tasks', JSON.stringify(tasks));
      inp.value = '';
      renderTasks();
    }

    function deleteTask(idx) {
      const tasks = JSON.parse(localStorage.getItem('marik_tasks') || '[]');
      tasks.splice(idx, 1);
      localStorage.setItem('marik_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    loadSettings();
    renderTasks();
    setPersona(currentPersona);
  </script>
</body>
</html>
